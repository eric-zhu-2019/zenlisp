[package]
name = "parinfer-wasm"
version = "0.1.0"
edition = "2021"
license = "ISC"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = "1"
serde_derive = "1"
serde_json = "1"
unicode-segmentation = "1.1"
unicode-width = "0.1.5"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
