<A NAME="format"><I>Function</I> <B>FORMAT</B></A> <P>
<P><B>Syntax:</B><P>
<B>format</B> <I>destination control-string <TT>&amp;rest</TT> args</I> =&gt; <I>result</I><P>
<P><B>Examples:</B><P>
<PRE> (format nil "~A" 'x) =&gt;  "X"</PRE>
<P>See also <A HREF="f_wr_stg.htm">WRITE-LINE</A>.</P>
